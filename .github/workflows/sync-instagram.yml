name: 🌙 Auto-Sync Instagram Stats

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual 1-click run from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and Sync Live Instagram Stats
        run: node scripts/sync-instagram.js

      - name: Commit and Push if stats changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/config.js
          if git diff --staged --quiet; then
            echo "No stats changes detected. Skipping commit."
          else
            git commit -m "🤖 Auto-sync Instagram stats for @beyondhours_ [skip ci]"
            git push origin main
          fi
